if(RK[r]){
const i=RK[r].findIndex(n=>n.toLowerCase()===nm);
if(i>=0){RK[r].splice(i,1);refR.set(RK);localStorage.setItem(KY+'r',JSON.stringify(RK))}
}});
}}
rL();toast('Deleted');
}

function cSort(col){if(cSortCol===col)cSortDir*=-1;else{cSortCol=col;cSortDir=col==='name'?1:-1}rChk()}

function chk(){
const txt=document.getElementById('i-paste').value.trim();
if(!txt){toast('Paste text');return}
const names=exN(txt);
if(!names.length){document.getElementById('cr').innerHTML='<div class="mt">No names detected</div>';return}
const tried=[],nt=[];
const seen=new Set();
names.forEach(n=>{
const lo=n.toLowerCase();
if(seen.has(lo))return;
seen.add(lo);
const m=E.filter(e=>e.name.toLowerCase()===lo);
m.length?tried.push({name:n,m}):nt.push(n);
});
chkData={tried,nt};
rChk();
}

function rChk(){
if(!chkData)return;
const{tried,nt}=chkData;
let h='';
if(nt.length===0&&tried.length>0){
h+=`<div class="alltried">⚠️ All names on this list have been tried already</div>`;
}
if(nt.length){
const sNt=[...nt];
if(cSortCol==='name')sNt.sort((a,b)=>a.localeCompare(b)*cSortDir);
h+=`<p class="st">🆕 Not yet tried (${sNt.length})</p>`;
h+=sNt.map(n=>`<span class="nt nn">${esc(n)}</span>`).join('');
}
if(tried.length){
let rows=[];
tried.forEach(t=>{t.m.forEach(m=>{rows.push({tname:t.name,receiver:m.receiver,date:m.date,opinion:m.opinion,service:m.service})})});
rows.sort((a,b)=>{let v=0;switch(cSortCol){
case'name':v=a.tname.localeCompare(b.tname);break;
case'receiver':v=a.receiver.localeCompare(b.receiver);break;
case'date':v=(a.date||'').localeCompare(b.date||'');break;
case'opinion':v=opSort(a.opinion)-opSort(b.opinion);break;
case'service':v=(a.service||'').localeCompare(b.service||'');break;
}return v*cSortDir});
const car=c=>cSortCol===c?(cSortDir===1?'▲':'▼'):'';
h+=`<p class="st">✅ Already tried (${tried.length})</p>`;
h+=`<table><tr>
<th onclick="cSort('name')">Name <span class="ar">${car('name')}</span></th>
<th onclick="cSort('receiver')">For <span class="ar">${car('receiver')}</span></th>
<th onclick="cSort('date')">Date <span class="ar">${car('date')}</span></th>
<th onclick="cSort('opinion')">Opinion <span class="ar">${car('opinion')}</span></th>
<th onclick="cSort('service')">Service <span class="ar">${car('service')}</span></th>
</tr>`;
rows.forEach(r=>{
const sv=r.service===DF?'':esc(r.service);
h+=`<tr><td class="nm">${esc(r.tname)}</td><td>${esc(r.receiver)}</td><td>${fD(r.date)}</td><td>${opTxt(r.opinion)}</td><td>${sv}</td></tr>`;
});
h+=`</table>`;
}
document.getElementById('cr').innerHTML=h;
}

function exN(txt){
const known=new Set(E.map(e=>e.name.toLowerCase()));
const found=[],seen=new Set();
txt.split(/[\n,]+/).forEach(line=>{
line=line.trim().replace(/^[\d\.\)\-\•\*\#]+\s*/,'').replace(/[\.!?;:]+$/,'').trim();
if(!line)return;
line.split(/\s+/).forEach(w=>{
let c=w.replace(/[^a-zA-ZÀ-ÿ\-]/g,'');
if(!c||c.length<2)return;
const lo=c.toLowerCase();
if(ST.has(lo))return;
if(known.has(lo))c=E.find(e=>e.name.toLowerCase()===lo).name;else c=cap(c);
if(!seen.has(lo)){seen.add(lo);found.push(c)}
})});
return found;
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase()}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
init();
</script>
